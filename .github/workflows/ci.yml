name: CI
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          VP_GIT_HOOKS: '0'
      # The task is defined in vite.config.ts (run.tasks.ci); the pre-push hook runs the same one.
      - run: pnpm exec vp run ci
