packages:
  - packages/*
  - example
  - docs
allowBuilds:
  esbuild: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: 'catalog:'
  # Nextra 4.6.1's <Layout> schema requires `children` after removing it from the props; zod 4.1 let that through, 4.6 doesn't.
  'nextra>zod': 4.1.13
  'nextra-theme-docs>zod': 4.1.13
permissions:
  ai:
    skills: false
